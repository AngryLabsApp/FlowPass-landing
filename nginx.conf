server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Service Worker: nunca cachear
  location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires off;
    try_files $uri =404;
  }

  # Manifest: cache corto
  location = /site.webmanifest {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # archivos estáticos
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Páginas pre-renderizadas (/privacidad -> privacidad.html). Si no existe,
  # responde 404 real (no "soft 404") con la página de error de la app.
  # El HTML siempre se revalida: apunta a los .js con hash del build, y un HTML
  # viejo en caché pide archivos que ya no existen después de un deploy.
  error_page 404 /404.html;
  location = /404.html {
    add_header Cache-Control "no-cache";
    internal;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ =404;
  }
}