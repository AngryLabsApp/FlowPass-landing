server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Service Worker: nunca cachear
  location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires off;
    try_files $uri =404;
  }

  # Manifest: cache corto
  location = /site.webmanifest {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # archivos estáticos
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback. El HTML siempre se revalida: apunta a los .js con hash del
  # build, y un HTML viejo en caché pide archivos que ya no existen después de
  # un deploy (página en blanco). Si no cambió, el servidor responde 304.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}