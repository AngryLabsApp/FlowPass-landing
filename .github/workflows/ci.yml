# Compila la landing en cada PR y en cada push a main.
# Si el build falla (error de Svelte, import roto, página que no se pre-renderiza), el PR se marca en rojo.
# La publicación la hace Coolify con Auto Deploy al mergear a main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si llegan dos ejecuciones para la misma rama, la anterior se cancela
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Valores de relleno: el build solo necesita que existan. Los reales viven en Coolify.
          PUBLIC_META_PIXEL_ID: ""
          PUBLIC_N8N_LEADS_WEBHOOK: https://example.com/webhook/leads
          PUBLIC_N8N_SUPPORT_WEBHOOK: https://example.com/webhook/soporte

