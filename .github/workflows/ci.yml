# Compila la landing en cada PR y en cada push a main.
# Si el build falla (error de Svelte, import roto, página que no se pre-renderiza), el PR se marca en rojo.
# En main, si compila, le pide a Coolify que publique (solo si existen los secretos COOLIFY_*).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si llegan dos ejecuciones para la misma rama, la anterior se cancela
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Valores de relleno: el build solo necesita que existan. Los reales viven en Coolify.
          PUBLIC_META_PIXEL_ID: ""
          PUBLIC_N8N_LEADS_WEBHOOK: https://example.com/webhook/leads
          PUBLIC_N8N_SUPPORT_WEBHOOK: https://example.com/webhook/soporte

  deploy:
    # Solo en main y solo si el build salió bien
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publicar en Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Faltan los secretos COOLIFY_WEBHOOK / COOLIFY_TOKEN: no se publica desde CI."
            exit 0
          fi
          curl --fail --silent --show-error -X GET "$COOLIFY_WEBHOOK" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
