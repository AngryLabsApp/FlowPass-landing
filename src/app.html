<!-- src/app.html -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- SEO Básico -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="FlowPass" />
    <meta name="theme-color" content="#07F49D" />
    
    <!-- Verificación de Google Search Console (IMPORTANTE) -->
    <meta name="google-site-verification" content="R00bHPJHp99EVnxuXsGDprcy58yVVmZpFp-SuSS-AkM" />
    
    <!-- Preconnect para GA -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- Preload local custom fonts -->
    <link rel="preload" href="/fonts/Epoch.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fonnts.com-oktah_neue_regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fonnts.com-oktah_neue_medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fonnts.com-oktah_neue_bold.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="font-oktah text-white">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
